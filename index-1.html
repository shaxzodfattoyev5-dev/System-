<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENERGY CORE</title>
<style>
:root{--bg:#04080c;--tx:#e6fbff;--dim:#9ccbd6;--cy:#3fe0f0;--sv:#cfd8df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -10%,#0d3a4a 0,transparent 55%),radial-gradient(ellipse at 100% 100%,#0a2a3a,transparent 50%),var(--bg);color:var(--tx);font:700 14px/1.45 'Trebuchet MS','Segoe UI',system-ui,sans-serif;letter-spacing:.02em;padding-bottom:84px;overflow-x:hidden}
#v{position:relative;z-index:1;max-width:560px;margin:0 auto}
header{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center}
header small{color:var(--cy);letter-spacing:.14em;text-shadow:0 0 8px var(--cy)}
h1{margin:0;font:900 32px Impact,'Arial Narrow Bold','Arial Narrow',sans-serif;letter-spacing:.09em;text-shadow:0 0 14px rgba(63,224,240,.55)}
header button{background:none;border:1px solid #9fb0bb;color:var(--sv);width:44px;height:44px;font-size:22px}
.win{position:relative;margin:34px 14px 30px;padding:22px 16px 20px;border:3px solid;border-image:linear-gradient(135deg,#f4f8fb,#7f8c97 30%,#e9eff3 55%,#6f7c87 80%,#f4f8fb) 1;background:linear-gradient(160deg,rgba(46,160,180,.55),rgba(14,66,90,.82));box-shadow:0 0 22px rgba(63,224,240,.22),inset 0 0 30px rgba(120,240,255,.16)}
.cr{position:absolute;left:50%;top:-27px;width:120px;height:30px;margin-left:-60px}
.cb{position:absolute;left:50%;bottom:-14px;width:36px;height:26px;margin-left:-18px}
.wt{font:900 14px Impact,'Arial Narrow',sans-serif;color:#9ff6ff;letter-spacing:.14em;margin-bottom:10px;text-shadow:0 0 8px rgba(63,224,240,.8)}
.row{display:flex;justify-content:space-between;padding:4px 0;text-transform:uppercase;text-shadow:0 1px 2px #02161d}
.dim,small{color:var(--dim);font-weight:600}
p{margin:6px 0 10px}
.bar{height:10px;background:#031219;border:1px solid #6b7b86;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1fb5c8,#8ff6ff);box-shadow:0 0 8px var(--cy)}
.rk{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.rk>div:last-child{flex:1}
.rkb{width:58px;height:58px;display:grid;place-items:center;font:900 34px Impact,sans-serif;color:var(--cy);border:3px solid var(--sv);background:#031219;text-shadow:0 0 12px var(--cy)}
.btn{background:rgba(3,18,25,.6);color:var(--tx);border:1px solid #9fb0bb;padding:10px 12px;min-height:44px;font:inherit;text-transform:uppercase;cursor:pointer;margin:2px 0}
.btn.on{background:var(--cy);color:#02222a;box-shadow:0 0 10px var(--cy)}
.btn.w{width:100%}
.g{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.g .btn{flex:1;min-width:60px}
label{display:flex;justify-content:space-between;margin-top:12px;text-transform:uppercase;font-size:12px;color:#c6f6ff}
.v{color:var(--cy)}
input[type=range]{width:100%;height:32px;accent-color:var(--cy)}
input[type=number],input[type=text],input[type=date],textarea{width:100%;background:rgba(2,14,20,.7);color:var(--tx);border:1px solid #9fb0bb;padding:10px;font:inherit;margin-top:4px}
textarea{resize:vertical}
.err{color:#ffd37a;min-height:20px;margin:6px 0}
.qr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(3,18,25,.5);border:1px solid #7f93a0;color:var(--tx);padding:10px;margin:6px 0;font:inherit;min-height:56px;cursor:pointer}
.qr.dn{border-color:var(--cy);background:rgba(63,224,240,.18)}
.qt{flex:1;display:block}.qt b,.qt small{display:block}
.ck{width:26px;height:26px;border:2px solid var(--sv);display:grid;place-items:center;color:var(--cy);flex:none}
.xp{color:var(--cy);font-size:12px;white-space:nowrap}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ac div{border:1px solid #7f93a0;padding:8px;opacity:.45}
.ac .u{opacity:1;border-color:var(--cy);box-shadow:inset 0 0 12px rgba(63,224,240,.25)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{aspect-ratio:1;display:grid;place-items:center;font-size:11px;border:1px solid #5b6d79;color:var(--dim)}
.cal .a{background:rgba(63,224,240,.35);color:#fff;border-color:var(--cy)}
.cal .f{background:var(--cy);color:#02222a}
ul{margin:4px 0;padding-left:18px}li{margin:4px 0;font-weight:600}
.warn{border-left:3px solid #ffcf6b;padding-left:10px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:rgba(3,10,14,.96);border-top:1px solid #6b7b86;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-size:10px;padding:8px 0;text-transform:uppercase;min-height:56px}
nav b{display:block;font-size:20px}
nav .on{color:var(--cy);text-shadow:0 0 8px var(--cy)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--cy);color:#02222a;padding:8px 16px;z-index:9;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.s{opacity:1}
.pt{position:fixed;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--cy);box-shadow:0 0 6px var(--cy);opacity:0;animation:fl 10s linear infinite;pointer-events:none;z-index:0}
@keyframes fl{10%{opacity:.55}100%{transform:translateY(-110vh);opacity:0}}
@media(prefers-reduced-motion:reduce){.pt{display:none}#toast{transition:none}}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}
.qc{border:1px solid #7f93a0;background:rgba(3,18,25,.5);padding:10px;margin:8px 0}.qc.dn{border-color:var(--cy);background:rgba(63,224,240,.18)}.qc.pz{opacity:.65}.qc .g .btn{min-width:48px;padding:8px 6px;font-size:12px;min-height:40px}.qr:disabled{opacity:.6;cursor:default}
select{background:rgba(2,14,20,.9);color:var(--tx);border:1px solid #9fb0bb;padding:8px;font:inherit}.row span:first-child{padding-right:8px}s{opacity:.6}.od{color:#ffb27a}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#04080c"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="cr" viewBox="0 0 120 30"><g fill="#cfd8df" stroke="#5d6a75" stroke-width="1"><path d="M60 2l7 9-7 12-7-12z"/><path d="M52 14C40 14 30 8 6 12c14 2 20 10 46 12z"/><path d="M68 14c12 0 22-6 46-2-14 2-20 10-46 12z"/><circle cx="60" cy="11" r="2.5" fill="#3fe0f0" stroke="none"/></g></symbol>
<symbol id="db" viewBox="0 0 36 26"><path d="M18 1l9 12-9 12-9-12z" fill="#cfd8df" stroke="#5d6a75"/><circle cx="18" cy="13" r="2" fill="#3fe0f0"/></symbol>
</defs></svg>
<header><div><small>[SYSTEM INITIALIZED]</small><h1>ENERGY CORE</h1></div><button data-a="nv" data-v="st" aria-label="Settings">⚙</button></header>
<main id="v"></main><nav></nav><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={e:{},q:{}},persist=true;
try{const r=localStorage.getItem('ec1');if(r){const o=JSON.parse(r);if(o&&o.e&&o.q)S=o}}catch(e){persist=false}
S.cq=Array.isArray(S.cq)?S.cq:[];S.x=Array.isArray(S.x)?S.x:[];
const sv=()=>{try{localStorage.setItem('ec1',JSON.stringify(S))}catch(e){persist=false}};
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const back=n=>{const d=new Date();d.setDate(d.getDate()-n);return dk(d)};
const days=n=>Array.from({length:n},(_,i)=>back(n-1-i));
const Q=[['am','Morning check-in','Log how you woke up today.',15],['pm','Evening check-in','Log how the day went.',15],['sl','Steady sleep rhythm','Keep bed and wake times close to your usual.',20],['ml','Regular meals','Eat at fairly regular times today.',15],['wa','Hydration','Drink water through the day.',10],['wk','Gentle walk','Only if it feels comfortable.',10],['rs','Rest when drained','Take a real break if you feel exhausted.',15]];
const xp=()=>S.x.reduce((a,z)=>a+(z.rev?0:z.xp),0);
const lv=x=>Math.floor(x/100)+1,rank=l=>'EDCBAS'[Math.min(5,Math.floor((l-1)/3))];
const g=(d,m,k)=>{const e=S.e[d];return e&&e[m]&&e[m][k]!=null?e[m][k]:null};
const eng=d=>{const v=[g(d,'pm','energy'),g(d,'am','energy')].filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b)/v.length:null};
const act=d=>!!(S.e[d]&&(S.e[d].am||S.e[d].pm))||Object.keys(S.q[d]||{}).length>0;
const run=()=>{let n=0,i=act(back(0))?0:1;while(i<400&&act(back(i))){n++;i++}return n};
const av=a=>{a=a.filter(x=>x!=null);return a.length?(a.reduce((x,y)=>x+y)/a.length).toFixed(1).replace('.0',''):'—'};
const AC=[['First sync','Log your first check-in',()=>Object.keys(S.e).length>0],['Full cycle','Morning and evening check-in on one day',()=>Object.values(S.e).some(e=>e.am&&e.pm)],['Steady observer','Check in on 7 different days',()=>Object.keys(S.e).length>=7],['Quest keeper','Complete 10 quests in total',()=>Object.values(S.q).reduce((a,o)=>a+Object.keys(o).length,0)>=10],['Self-aware','Add notes or symptoms to 3 entries',()=>Object.values(S.e).reduce((a,e)=>a+['am','pm'].filter(m=>e[m]&&(e[m].notes||e[m].sym)).length,0)>=3],['Rank D','Reach level 4',()=>lv(xp())>=4]];
const W=(t,h)=>`<section class="win"><svg class="cr"><use href="#cr"/></svg>${t?`<div class="wt">${t}</div>`:''}${h}<svg class="cb"><use href="#db"/></svg></section>`;
function chart(ser,mn,mx){const Wd=300,H=100,n=ser[0].v.length;if(Math.max(...ser.map(o=>o.v.filter(x=>x!=null).length))<2)return '<p class="dim">Not enough data yet. Log at least two days to see a trend.</p>';
let s=`<svg viewBox="0 0 ${Wd} ${H+4}" width="100%" role="img" aria-label="Trend chart">`;
for(let i=0;i<3;i++){const y=6+(H-12)*i/2;s+=`<line x1="0" x2="${Wd}" y1="${y}" y2="${y}" stroke="#9fe9f5" stroke-opacity=".22"/>`}
ser.forEach(o=>{let p='',pen=0,c='';o.v.forEach((v,i)=>{if(v==null){pen=0;return}const x=(i*(Wd-8)/(n-1)+4).toFixed(1),y=(6+(H-12)*(1-(v-mn)/(mx-mn))).toFixed(1);p+=(pen?'L':'M')+x+' '+y;pen=1;c+=`<circle cx="${x}" cy="${y}" r="2.6" fill="${o.c}"/>`});s+=`<path d="${p}" fill="none" stroke="${o.c}" stroke-width="2"/>`+c});
return s+'</svg>'}
let V='sys',Dt=dk(),Md='am',F={},R=7;
const load=()=>{F=JSON.parse(JSON.stringify((S.e[Dt]||{})[Md]||{}))};
function rSys(){const t=dk(),en=S.e[t]||{},none=!Object.keys(S.e).length,x=xp(),l=lv(x),ev=eng(t),sl=g(t,'am','sleep'),rs=g(t,'am','rest'),md=g(t,'pm','mood'),q=S.q[t]||{},dn=Q.filter(z=>q[z[0]]).length;
let h=W('[Player Status]',`<div class="rk"><div class="rkb">${rank(l)}</div><div><div>LEVEL ${l} · RANK ${rank(l)}</div><div class="bar"><i style="width:${x%100}%"></i></div><small>${x%100}/100 XP to next level · game score only</small></div></div>
<div class="row"><span>Energy:</span><span>${ev==null?'—':ev.toFixed(1).replace('.0','')} / 10</span></div>
<div class="row"><span>Sleep:</span><span>${sl==null?'—':sl} hours</span></div>
<div class="row"><span>Sleep quality:</span><span>${rs==null?'—':rs+' / 10 rested'}</span></div>
<div class="row"><span>Mood:</span><span>${md==null?'—':md+' / 10'}</span></div>
<div class="row"><span>Recovery:</span><span>${dn==Q.length?'COMPLETE':'IN PROGRESS'}</span></div><div class="bar"><i style="width:${dn/Q.length*100}%"></i></div>`+(none?`<p class="dim">No data yet. Enter your first check-in to activate the system.</p><button class="btn on w" data-a="nv" data-v="ci">Begin first check-in</button>`:''));
h+=W('[Today’s Quests]',`<div class="row"><span>Completed</span><span>${dn}</span></div><div class="row"><span>Remaining</span><span>${Q.length-dn}</span></div><button class="btn w" data-a="nv" data-v="qs">Open quests</button>`);
h+=W('[7-Day Energy]',chart([{v:days(7).map(eng),c:'#8ff6ff'}],0,10));
return h+`<p class="dim" style="margin:0 18px 8px;font-size:12px">ENERGY CORE is a self-tracking tool, not a medical device. Scores, XP and ranks are not health assessments.</p>`}
const sl=(k,l)=>`<label>${l}<b class="v" id="o_${k}">${F[k]??'—'}</b></label><input type="range" min="1" max="10" value="${F[k]??5}" data-k="${k}">`;
const op=(k,l,a)=>`<label>${l}</label><div class="g">${a.map(o=>{const[v,t]=Array.isArray(o)?o:[o,o];return `<button class="btn${F[k]==v?' on':''}" data-a="opt" data-k="${k}" data-o="${v}">${t}</button>`}).join('')}</div>`;
function rCi(){const am=Md=='am',ex=(S.e[Dt]||{})[Md];
const f=am?`<label>Hours slept</label><input type="number" inputmode="decimal" step="0.25" min="0" max="24" data-k="sleep" value="${F.sleep??''}" placeholder="e.g. 7.5">`+sl('rest','How rested (1–10)')+sl('energy','Energy now (1–10)')+op('wake','Difficulty waking (1 easy – 5 hard)',[1,2,3,4,5])+op('night','Woke during the night?',[['no','No'],['once','Once'],['many','Several times']])
:sl('energy','Current energy')+sl('mood','Mood')+sl('irr','Irritability')+sl('stress','Stress')+op('act','Physical activity',[['none','None'],['light','Light'],['mod','Moderate'],['hard','Hard']])+op('meals','Regular meals?',[['yes','Yes'],['most','Mostly'],['no','No']])+op('water','Hydration (approx.)',[['low','0–2 glasses'],['mid','3–5'],['high','6+']])+`<label>Symptoms (optional)</label><input type="text" data-k="sym" value="${esc(F.sym||'')}" placeholder="e.g. headache">`;
const hist=Object.keys(S.e).sort().reverse().slice(0,10);
return W('[Check-in]',`<div class="g"><button class="btn${am?' on':''}" data-a="md" data-v="am">Morning</button><button class="btn${am?'':' on'}" data-a="md" data-v="pm">Evening</button></div>
<label>Date</label><input type="date" id="dt" value="${Dt}" max="${dk()}">${ex?'<p class="dim">Editing a saved entry.</p>':''}${f}
<label>Notes (optional)</label><textarea data-k="notes" rows="2">${esc(F.notes||'')}</textarea><div class="err" id="err"></div>
<button class="btn on w" data-a="save">${ex?'Update':'Save'} ${am?'morning':'evening'} check-in</button>${ex?'<button class="btn w" data-a="del">Delete this entry</button>':''}`)+W('[Previous Check-ins]',hist.length?hist.map(d=>`<button class="btn w" data-a="gd" data-d="${d}">${d} ${S.e[d].am?'☀ morning ':''}${S.e[d].pm?'☾ evening':''}</button>`).join(''):'<p class="dim">No check-ins yet.</p>')}
function saveCI(){const am=Md=='am',er=$('#err');
if(am&&(F.sleep==null||isNaN(F.sleep)||F.sleep<0||F.sleep>24))return er.textContent='Enter hours slept, between 0 and 24.';
if(F.energy==null)return er.textContent='Move the energy slider to set a rating.';
const o={};for(const k in F)if(F[k]!==undefined&&F[k]!=='')o[k]=F[k];
(S.e[Dt]=S.e[Dt]||{})[Md]=o;setB(Dt,Md,1);sv();toast('Check-in saved');render()}
function delCI(){const e=S.e[Dt];delete e[Md];if(!e.am&&!e.pm)delete S.e[Dt];setB(Dt,Md,0);sv();load();toast('Entry deleted');render()}
function rQs0(){const q=S.q[QDt]||{},x=xp(),l=lv(x),w=days(7).filter(act).length;
return W('[Daily Quests]',`<p class="dim">XP rewards tracking and recovery. Nothing here rewards skipping sleep, restricting food or pushing through pain.</p>`+Q.map(z=>`<button class="qr${q[z[0]]?' dn':''}" data-a="tq" data-id="${z[0]}"><span class="ck">${q[z[0]]?'✔':''}</span><span class="qt"><b>${z[1]}</b><small>${z[2]}</small></span><span class="xp">+${z[3]} XP</span></button>`).join(''))
+W('[Progress]',`<div class="rk"><div class="rkb">${rank(l)}</div><div><div>LEVEL ${l} · ${x} XP</div><div class="bar"><i style="width:${x%100}%"></i></div><small>${100-x%100} XP to next level</small></div></div><div class="row"><span>Active days this week</span><span>${w} / 7</span></div><div class="row"><span>Current run</span><span>${run()} days</span></div><small>Missed days never reset your level or XP.</small>`)
+W('[Achievements]',`<div class="ac">${AC.map(a=>`<div class="${a[2]()?'u':''}"><b>${a[2]()?'✔ ':''}${a[0]}</b><small>${a[1]}</small></div>`).join('')}</div>`)}
function corr(){const p=[];days(90).forEach(d=>{const s=g(d,'am','sleep'),e=g(d,'pm','energy')??g(d,'am','energy');if(s!=null&&e!=null)p.push([s,e])});
if(p.length<7)return `Not enough data yet (${p.length}/7 days with sleep and energy logged).`;
const m=p.map(x=>x[0]).sort((a,b)=>a-b)[p.length>>1],hi=p.filter(x=>x[0]>=m),lo=p.filter(x=>x[0]<m);
if(!lo.length)return 'Not enough variation in sleep yet.';
const a=x=>x.reduce((s,y)=>s+y[1],0)/x.length,df=a(hi)-a(lo);
let r=df>=.5?'Your energy ratings were higher on days following longer sleep during this tracking period.':df<=-.5?'Your energy ratings were lower on days following longer sleep during this tracking period.':'Your energy ratings looked similar after shorter and longer sleep during this tracking period.';
return r+` (${hi.length} longer vs ${lo.length} shorter nights. This is an observation, not a cause.)`}
function rAn(){const D=days(R),c=days(30),w=days(7);
const rg=`<div class="g"><button class="btn${R==7?' on':''}" data-a="rng" data-v="7">7 days</button><button class="btn${R==30?' on':''}" data-a="rng" data-v="30">30 days</button></div>`;
return W('[Energy Trend]',rg+chart([{v:D.map(eng),c:'#8ff6ff'}],0,10))
+W('[Sleep Hours]',chart([{v:D.map(d=>g(d,'am','sleep')),c:'#b9a7ff'}],0,12))
+W('[Mood & Stress]',chart([{v:D.map(d=>g(d,'pm','mood')),c:'#7dffb2'},{v:D.map(d=>g(d,'pm','stress')),c:'#ffb27a'}],0,10)+'<small><span style="color:#7dffb2">● mood</span> &nbsp; <span style="color:#ffb27a">● stress</span></small>')
+W('[Calendar · 30 Days]',`<div class="cal">${c.map(d=>{const e=S.e[d]||{};return `<span class="${e.am&&e.pm?'f':e.am||e.pm?'a':''}" title="${d}">${+d.slice(8)}</span>`}).join('')}</div><small>Bright = both check-ins, tinted = one.</small>`)
+W('[Weekly Summary]',`<div class="row"><span>Days checked in</span><span>${w.filter(d=>S.e[d]).length} / 7</span></div><div class="row"><span>Avg energy</span><span>${av(w.map(eng))}</span></div><div class="row"><span>Avg sleep</span><span>${av(w.map(d=>g(d,'am','sleep')))} h</span></div><div class="row"><span>Avg mood</span><span>${av(w.map(d=>g(d,'pm','mood')))}</span></div><div class="row"><span>Avg stress</span><span>${av(w.map(d=>g(d,'pm','stress')))}</span></div>`)
+W('[Sleep vs Energy]',`<p>${corr()}</p>`)}
function rRc(){const s=days(7).map(d=>g(d,'am','sleep')).filter(x=>x!=null),sa=s.length?s.reduce((a,b)=>a+b)/s.length:null,e21=days(21).map(eng).filter(x=>x!=null),ea=e21.length?e21.reduce((a,b)=>a+b)/e21.length:null;
let n='';
if(sa!=null)n+=`<li>Your logged sleep averaged ${sa.toFixed(1)} h this week. Needs vary, and many adults do well with roughly 7–9 hours.</li>`;
if(e21.length>=10&&ea<=4)n+=`<li>Your energy ratings have been low across several weeks. That is worth discussing with a healthcare professional.</li>`;
if(!n)n='<li class="dim">Log a few check-ins and notes will appear here based on your entries.</li>';
return W('[Your Notes]',`<ul>${n}</ul>`)
+W('[Sleep Routine]','<ul><li>Keep bed and wake times fairly steady, including days off.</li><li>Dim lights and screens for a while before bed.</li><li>If you wake at night, keep lights low and avoid checking the clock.</li></ul>')
+W('[Regular Nutrition]','<ul><li>Eat at fairly regular times rather than skipping meals.</li><li>Keep easy foods nearby for busy or low-energy days.</li></ul>')
+W('[Hydration]','<ul><li>Sip water across the day instead of all at once.</li><li>Keep a bottle where you work or study.</li></ul>')
